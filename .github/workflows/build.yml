name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Herramientas de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Compilar
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/34.0.0"
          JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          V=${{ github.run_number }}
          rm -rf build
          mkdir -p build/res/drawable build/assets build/src/com/spark/launcher build/gen build/classes build/dex
          cp ic_launcher.xml build/res/drawable/
          cp index.html build/assets/
          cp MainActivity.java build/src/com/spark/launcher/
          "$BT/aapt2" compile --dir build/res -o build/res.zip
          "$BT/aapt2" link -o build/base.apk -I "$JAR" --manifest AndroidManifest.xml -A build/assets build/res.zip \
            --java build/gen --min-sdk-version 21 --target-sdk-version 28 --version-code "$V" --version-name "1.$V"
          javac -source 8 -target 8 -nowarn -encoding UTF-8 -cp "$JAR" -d build/classes $(find build/src build/gen -name '*.java')
          "$BT/d8" --release --lib "$JAR" --min-api 21 --output build/dex $(find build/classes -name '*.class')
          cp build/base.apk build/unsigned.apk
          (cd build/dex && zip -q ../unsigned.apk classes.dex)
          "$BT/zipalign" -f -p 4 build/unsigned.apk build/aligned.apk
          if [ ! -f spark.keystore ]; then
            keytool -genkeypair -keystore spark.keystore -storepass sparkltz -keypass sparkltz -alias spark \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Spark LTZ"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add spark.keystore
            git commit -m "Llave para firmar la app"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          "$BT/apksigner" sign --ks spark.keystore --ks-pass pass:sparkltz --key-pass pass:sparkltz \
            --ks-key-alias spark --out SparkLTZ.apk build/aligned.apk

      - name: Publicar el APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${{ github.run_number }}" SparkLTZ.apk \
            --title "Spark LTZ 1.${{ github.run_number }}" \
            --notes "Descarga SparkLTZ.apk y ábrelo en la pantalla del carro para instalarlo."
